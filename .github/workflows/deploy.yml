name: Java CI/CD with Docker & ALB
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 2. 동적으로 EC2 퍼블릭 IP 가져오기
      - name: Get EC2 Public IP
        id: get-ip
        run: |
          IP=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=lh-assist-backend-server" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].PublicIpAddress" --output text)
          echo "EC2_IP=$IP" >> $GITHUB_ENV

      # 3. Spring Boot 빌드
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build -x test

      # 4. Docker build & push
      - name: Docker login & push
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/lh-assist-backend .
          docker push ${{ secrets.DOCKER_USERNAME }}/lh-assist-backend

      # 5. EC2 접속 및 컨테이너 교체
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/lh-assist-backend
            sudo docker stop lh-assist-backend || true
            sudo docker rm lh-assist-backend || true
            sudo docker run -d --name lh-assist-backend -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/lh-assist-backend
