<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: A4; margin: 15mm; }
        body { font-family: 'NotoSerifKR', serif; color: #333; line-height: 1.4; }

        /* --- 레이아웃 공통 --- */
        .section { margin-bottom: 30px; }
        .page-break { page-break-before: always; }

        /* --- 헤더 --- */
        .header { border-bottom: 2px solid #4CAF50; padding-bottom: 10px; margin-bottom: 25px; }
        .title { font-size: 24px; font-weight: bold; color: #2c3e50; }
        .meta { color: #666; font-size: 12px; margin-top: 5px; }

        /* --- KPI 박스 --- */
        .kpi-container { display: table; width: 100%; table-layout: fixed; background: #f8f9fa; border-radius: 8px; padding: 15px 0; }
        .kpi-item { display: table-cell; text-align: center; border-right: 1px solid #ddd; }
        .kpi-item:last-child { border-right: none; }
        .kpi-value { font-size: 24px; font-weight: bold; color: #4CAF50; display: block; margin-bottom: 5px; }
        .kpi-label { font-size: 12px; color: #666; font-weight: bold; }
        .kpi-value.HIGH { color: #F44336; }
        .kpi-value.MEDIUM { color: #FFC107; }

        /* --- 차트 공통 --- */
        .chart-box { border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 15px; page-break-inside: avoid; }
        .chart-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #444; }

        /* 바 차트 */
        .bar-container { background: #eee; height: 16px; border-radius: 8px; overflow: hidden; display: flex; width: 100%; }
        .bar-segment { height: 100%; float: left; } /* PDF 렌더러 호환성 위해 float 사용 권장 */
        .bar-safe { background: #4CAF50; }
        .bar-medium { background: #FFC107; }
        .bar-high { background: #F44336; }

        /* 범례 */
        .legend { margin-top: 8px; font-size: 10px; text-align: right; }
        .legend span { margin-left: 10px; font-weight: bold; }

        /* --- 리스크 상세 카드 --- */
        .risk-group-title { font-size: 17px; font-weight: bold; margin: 30px 0 10px 0; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .risk-card { border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin-bottom: 12px; background: #fff; page-break-inside: avoid; }

        .risk-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 8px; }

        /* 뱃지 스타일 (Enum 매핑용) */
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; color: white; font-weight: bold; }
        .type-missing { background: #E53935; }
        .type-appropriateness { background: #FB8C00; }
        .type-clarity { background: #7CB342; }
        .type-procedure { background: #1E88E5; }

        .risk-content { font-size: 12px; }
        .text-label { font-weight: bold; color: #555; display: inline-block; width: 60px; }
        .text-body { color: #333; }
        .guide-box { background: #f0f7ff; padding: 8px; border-radius: 4px; margin-top: 8px; color: #0056b3; font-size: 12px; }

    </style>
</head>
<body>

<div th:if="${showCover}">
    <div class="header">
        <div class="title">LH 공공사업 리스크 분석 보고서</div>
        <div class="meta">
            문서명: <span th:text="${data.title}">문서명</span> |
            분석일: <span th:text="${data.analyzedDate}">2026-02-09</span>
        </div>
    </div>

    <div class="section kpi-container">
        <div class="kpi-item">
            <span class="kpi-value" th:text="${data.totalScore}">85</span>
            <span class="kpi-label">종합 점수</span>
        </div>
        <div class="kpi-item">
            <span class="kpi-value" th:text="${data.violationCount}">12</span>
            <span class="kpi-label">위반 건수</span>
        </div>
        <div class="kpi-item">
            <span class="kpi-value" th:classappend="${data.riskLevel}" th:text="${data.riskLevel}">HIGH</span>
            <span class="kpi-label">위험 등급</span>
        </div>
    </div>

    <div class="section chart-box">
        <div class="chart-title">종합 리스크 분포</div>
        <div class="bar-container">
            <div class="bar-segment bar-safe" th:style="'width:' + ${data.safePercent} + '%'"></div>
            <div class="bar-segment bar-medium" th:style="'width:' + ${data.mediumPercent} + '%'"></div>
            <div class="bar-segment bar-high" th:style="'width:' + ${data.highPercent} + '%'"></div>
        </div>
        <div class="legend">
            <span style="color:#4CAF50">● 안전 (<span th:text="${data.safePercent}"></span>%)</span>
            <span style="color:#FFC107">● 주의 (<span th:text="${data.mediumPercent}"></span>%)</span>
            <span style="color:#F44336">● 위험 (<span th:text="${data.highPercent}"></span>%)</span>
        </div>
    </div>

    <div class="section chart-box">
        <div class="chart-title">유형별 위반 통계</div>
        <table style="width:100%; font-size:11px; border-collapse: collapse;">
            <tr th:each="stat : ${data.riskTypeStats}" style="border-bottom:1px solid #f1f1f1;">
                <td style="padding: 8px; width: 20%; font-weight:bold;" th:text="${stat.label}">누락</td>
                <td style="padding: 8px; width: 60%;">
                    <div style="background:#eee; height:10px; border-radius:5px; width:100%;">
                        <div style="height:100%; border-radius:5px;" th:style="${stat.widthStyle}"></div>
                    </div>
                </td>
                <td style="padding: 8px; text-align:right;" th:text="${stat.count} + '건 (' + ${stat.percent} + '%)'">5건 (10%)</td>
            </tr>
        </table>
    </div>

    <!-- 상세 분석 내역은 페이지별 요약 PDF에서만 출력 -->
</div>

<div th:if="${!showCover}">
    <div th:each="entry : ${data.itemsByPage}">
        <div class="risk-group-title">PAGE <span th:text="${entry.key}">1</span></div>
        <div style="font-size:10px; color:#777; margin: -6px 0 10px 0;">각주[하이라이팅 된 내용]</div>

        <div th:each="item : ${entry.value}" class="risk-card">
            <div class="risk-header">
                <div>
                    <span style="font-weight:bold; font-size:12px; margin-right:6px;">#<span th:text="${item.marker}">1</span></span>
                    <span class="badge" th:classappend="'type-' + ${item.cssClass}" th:text="${item.riskTypeLabel}">누락</span>
                    <span style="font-weight:bold; font-size:12px; margin-left:5px;">우선순위 <span th:text="${item.priority}">1</span></span>
                </div>
                <div style="font-weight:bold; color:#F44336;">
                    리스크 점수: <span th:text="${item.riskScore}">90</span>
                </div>
            </div>

            <div class="risk-content">
                <div style="margin-bottom:6px;">
                    <span class="text-label">검출 내용</span>
                    <span class="text-body" th:text="${item.detectedText}">...</span>
                </div>
                <div style="margin-bottom:6px;">
                    <span class="text-label">판단 근거</span>
                    <span class="text-body" style="color:#666;" th:text="${item.reasoning}">...</span>
                </div>
                <div class="guide-box">
                    <strong>💡 가이드:</strong> <span th:text="${item.guideMessage}">...</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
