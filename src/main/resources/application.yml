spring:
  application:
    name: lh-assist-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/lh_assist_db
    username: postgres
    password: jiny0609
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: us-east-1
      s3:
        bucket: ${AWS_S3_BUCKET}
      stack:
        auto: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

app:
  sqs:
    document-analyze-queue-url: ${SQS_DOCUMENT_ANALYZE_QUEUE_URL:}
    max-attempts: 3
    retry-delay-ms: 200