spring:
  application:
    name: lh-assist-backend

  mail:
    host: smtp.naver.com
    port: 465
    username: ${EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.naver.com
    sender: ${EMAIL_ADDRESS}

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: us-east-1
      s3:
        bucket: ${AWS_S3_BUCKET}
      stack:
        auto: false

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  issuer: lh-assist
  audience: lh-assist-client
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

app:
  email:
    verification:
      ttl-minutes: 5
      resend-limit: 5
      pepper: ${EMAIL_VERIFICATION_PEPPER:}
  sqs:
    document-analyze-queue-url: ${SQS_DOCUMENT_ANALYZE_QUEUE_URL:}
    max-attempts: 3
    retry-delay-ms: 200
  suggestion:
    view-count:
      flush-interval-ms: 60000
  notice:
    view-count:
      flush-interval-ms: 60000
  chatbot:
    fastapi:
      base-url: ${CHATBOT_FASTAPI_BASE_URL:http://localhost:8000}
      stream-path: ${CHATBOT_FASTAPI_STREAM_PATH:/generate-stream}
    sse:
      timeout-ms: 60000
      heartbeat-ms: 15000

  admin:
    bootstrap:
      enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}
      name: ${APP_ADMIN_NAME:}
      test-user:
        enabled: ${APP_TEST_USER_BOOTSTRAP_ENABLED:false}
        email: ${APP_TEST_USER_EMAIL:}
        password: ${APP_TEST_USER_PASSWORD:}
        name: ${APP_TEST_USER_NAME:}
