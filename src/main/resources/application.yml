server:
  compression:
    enabled: false

  tomcat:
    threads:
      max: 200
      min-spare: 10
      max-queue-capacity: 2147483647
    max-connections: 8192
    accept-count: 100
    connection-timeout: 60000
    keep-alive-timeout: 30000
    max-http-header-size: 8192
    max-keep-alive-requests: 100

spring:
  application:
    name: lh-assist-backend

  mail:
    host: smtp.naver.com
    port: 465
    username: ${EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.naver.com
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
    sender: ${EMAIL_ADDRESS}

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: us-east-1
      s3:
        bucket: ${AWS_S3_BUCKET}
      stack:
        auto: false

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      access: unrestricted
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  issuer: lh-assist
  audience: lh-assist-client
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    verification:
      ttl-minutes: 5
      resend-limit: 5
      pepper: ${EMAIL_VERIFICATION_PEPPER:}
  sqs:
    document-analyze-queue-url: ${SQS_DOCUMENT_ANALYZE_QUEUE_URL:}
    max-attempts: 3
    retry-delay-ms: 200
  analysis:
    callback-token: ${APP_ANALYSIS_CALLBACK_TOKEN:}
    dashboard:
      cron: "0 0 0 * * *"
      cron-zone: "Asia/Seoul"
  suggestion:
    view-count:
      flush-interval-ms: 60000
  notice:
    view-count:
      flush-interval-ms: 60000
  chatbot:
    fastapi:
      base-url: ${CHATBOT_FASTAPI_BASE_URL}
      stream-path: ${CHATBOT_FASTAPI_STREAM_PATH:/ai/generate-stream}
      response-timeout-ms: ${CHATBOT_FASTAPI_RESPONSE_TIMEOUT_MS:600000}
      connect-timeout-ms: ${CHATBOT_FASTAPI_CONNECT_TIMEOUT_MS:15000}
    sse:
      timeout-ms: ${CHATBOT_SSE_TIMEOUT_MS:600000}
