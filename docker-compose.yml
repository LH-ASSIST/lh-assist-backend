services:
  db:
    image: ankane/pgvector:latest
    container_name: lh-assist-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lh_assist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jiny0609
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: lh-assist-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: lh-assist-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: lh-assist-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin