services:
  db:
    image: ankane/pgvector:latest
    container_name: lh-assist-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lh_assist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jiny0609
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: lh-assist-redis
    ports:
      - "6379:6379"